version: "3.9"

services:
  pipeline-app:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    container_name: enterprise_langgraph_pipeline
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    env_file:
      - ../.env
    volumes:
      - ../logs:/app/logs
    networks:
      - pipeline-net

  postgres:
    image: postgres:16-alpine
    container_name: pipeline_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-pipeline_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-pipeline_password_secure_mock}
      POSTGRES_DB: ${POSTGRES_DB:-pipeline_db}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-pipeline_user} -d ${POSTGRES_DB:-pipeline_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - pipeline-net

volumes:
  pgdata:
    driver: local

networks:
  pipeline-net:
    driver: bridge
