name: CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality-and-test:
    name: Lint & Test Suite
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: pipeline_user
          POSTGRES_PASSWORD: pipeline_password_secure_mock
          POSTGRES_DB: pipeline_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Run Ruff Linter & Code Quality
        run: |
          ruff check .

      - name: Run Ruff Format Verification
        run: |
          ruff format --check .

      - name: Execute Pytest Suite
        env:
          OPENAI_API_KEY: mock-openai-token
          ANTHROPIC_API_KEY: mock-anthropic-token
          POSTGRES_URL: postgresql://pipeline_user:pipeline_password_secure_mock@localhost:5432/pipeline_db
          LOG_LEVEL: DEBUG
        run: |
          pytest -v --tb=short
